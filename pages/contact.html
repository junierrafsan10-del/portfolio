<!-- কন্টাক্ট সেকশন -->
    <section class="container my-5 py-4">
        <h2 class="fw-bold text-center text-dark mb-5">Get In Touch</h2>
        <div class="row g-5">
            
            <!-- বাম কলাম: কন্টাক্ট ফর্ম (কপি সোর্স: Forms -> Overview) -->
            <div class="col-md-6">
                <div class="card p-4 shadow-sm border-0 bg-white h-100">
                    <h4 class="fw-bold text-secondary mb-4">Send a Message</h4>
                    <form>
                        <div class="mb-3">
                            <label class="form-label fw-bold small text-muted">Your Name</label>
                            <input type="text" class="form-control" placeholder="Enter your name" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold small text-muted">Email Address</label>
                            <input type="email" class="form-control" placeholder="name@example.com" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold small text-muted">Message</label>
                            <textarea class="form-control" rows="4" placeholder="Write your message here..." required></textarea>
                        </div>
                        <button type="submit" class="btn btn-dark fw-bold w-100 py-2 mt-2 shadow-sm">Submit Form ✉️</button>
                    </form>
                </div>
            </div>

            <!-- ডান কলাম: গুগল ম্যাপ (Iframe Embedding) -->
            <div class="col-md-6">
                <div class="card p-2 shadow-sm border-0 bg-white h-100">
                    <!-- পরীক্ষার খাতার জন্য সাধারণ ঢাকার ম্যাপ এমবেড করা হলো -->
                    <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d58434.85172283995!2d90.35465995400589!3d23.741916328655473!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3755b8b087026b81%3A0x8fa563bbd129325a!2sDhaka!5e0!3m2!1sen!2sbd!4v1710000000000!5m2!1sen!2sbd" 
                        class="w-100 h-100 rounded" style="border:0; min-height: 350px;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade">
                    </iframe>
                </div>
            </div>

        </div>
    </section>
